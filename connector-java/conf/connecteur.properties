# Configuration du connecteur OpenHR (voir connector-java/README.md)

# Port HTTP d'écoute du connecteur (consommé par le serveur Node de la page web)
port=8091

# true = dossier fictif sans appel OpenHR (aucun JAR requis) ; false = API OpenHR réelle
mock=true

# Chemins des fichiers de configuration OpenHR (utilisés si mock=false)
openhr.configuration=conf/openhr.properties
log4j.configuration=conf/log4j.properties

# Utilisateur de service HRa (table UC10 ou Login Module du site) et son rôle.
# NE PAS utiliser l'utilisateur de session (accès sans confidentialité) :
# préférez un vrai utilisateur avec un rôle de consultation adapté.
openhr.utilisateur=
openhr.motdepasse=
# Forme canonique du rôle : MODELE(PARAMETRE) — ex. DRH(), CONSULT-RH()
# Ici : modèle EMPLOYEE, paramètre MMA01090.
# NB : un rôle EMPLOYEE(<matricule>) limite généralement la visibilité au seul
# dossier de ce collaborateur (confidentialité self-service) — adapté aux
# tests ; pour consulter n'importe quel dossier, utilisez un rôle RH/manager.
openhr.role=EMPLOYEE(MMA01090)

# Processus HR Access de gestion de dossiers utilisé pour la lecture
# (doit figurer dans session.process_list du fichier openhr.properties,
#  être de qualification "Gestion de dossiers", déclaré et compilé)
openhr.processus=FS001

# Structure de données du dossier salarié
openhr.structure=ZY

# Réglementation (rubrique ZY00 SOCCLE) utilisée pour la recherche par matricule
openhr.reglementation=HRA

# Informations (sections) du dossier à lire, séparées par des virgules.
# ATTENTION : elles doivent être rattachées explicitement au processus ci-dessus.
# Codes standard indicatifs — à adapter au dossier de votre site :
#   00 = Identification, 07 = État civil, 10 = Naissance, 12 = Nationalité, 0F = Adresses
openhr.sections=00,07,10,12,0F
