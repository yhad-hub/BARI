# Configuration de la session OpenHR (cf. Guide du développeur OpenHR, chap. "La session").
# Adaptez les valeurs à votre installation.

# Langues de travail (7.30.50+ ; avant, utiliser session.language=F)
session.languages=F,U

# Processus utilisés par la session : détermine le dictionnaire (structures,
# informations, rubriques). Qualification "Gestion de dossiers", compilés.
session.process_list=FS001

# Répertoire de travail (et de cache du dictionnaire *.dic) — doit exister
session.work_directory=/opt/connecteur-openhr/work

# Nom d'hôte ou IP de la machine hébergeant le serveur OpenHR
openhr_server.server=10.11.12.13

# Timeout (secondes) des requêtes au serveur OpenHR (0 = infini)
openhr_server.timeout=30

# --- Émetteurs de messages (message senders) ---
# Configuration de DÉVELOPPEMENT : transport non sécurisé.
normal_message_sender.security=disabled
normal_message_sender.port=8800
sensitive_message_sender.security=disabled
sensitive_message_sender.port=8800
privilegied_message_sender.security=disabled
privilegied_message_sender.port=8800

# --- PRODUCTION : sécurisation IMPÉRATIVE (cf. guide, chap. 5) ---
# Les messages "sensibles" (connexion utilisateur = mot de passe) doivent être
# en SSL, les messages "privilèges" en SSL2 (authentification mutuelle).
# La configuration du client doit correspondre à celle du serveur OpenHR.
#sensitive_message_sender.security=SSL
#sensitive_message_sender.port=8801
#sensitive_message_sender.ca_certificate_filename=ClientCA.cer
#sensitive_message_sender.ca_certificate_password=secret
#privilegied_message_sender.security=SSL2
#privilegied_message_sender.port=8802
#privilegied_message_sender.ca_certificate_filename=ClientCA.cer
#privilegied_message_sender.ca_certificate_password=secret
#privilegied_message_sender.certificate_filename=Client.cer
#privilegied_message_sender.certificate_password=secret2
